<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 -11 216 216">
  <!-- Spaarvarken, naar links kijkend, egaal in één kleur roze. Getekend in
       de pixelmaten van het voorbeeld; de viewBox maakt er een vierkant van.
       De kleuren staan hier los van style.css: een favicon kan de
       CSS-variabelen niet lezen. -->
  <g fill="#f9c4cf">
    <!-- pootjes: één voor, één achter -->
    <rect x="82" y="135" width="30" height="37" rx="9"/>
    <rect x="176" y="135" width="30" height="37" rx="9"/>
    <!-- oor: de Q-bocht rondt de punt af -->
    <path d="M70 70 Q66 46 70 36 Q74 30 80 35 Q90 44 98 54 Z"/>
    <!-- lijf -->
    <path d="M55 110 C50 70 80 28 145 26 C205 24 240 60 238 100 C236 140 200 160 145 160 C95 160 60 145 55 110 Z"/>
    <!-- snuit, met een overgang die hem laat doorlopen in de kop -->
    <ellipse cx="51" cy="97" rx="10" ry="17"/>
    <path d="M50 81 C60 78 66 72 72 66 L72 126 C66 120 60 114 50 113 Z"/>
  </g>
  <!-- krulstaartje: een hele lus -->
  <path d="M234 88 C244 88 250 80 247 72 C244 64 234 68 237 75 C239 80 246 79 248 74" fill="none" stroke="#f9c4cf" stroke-width="6" stroke-linecap="round"/>
  <!-- oog en muntgleuf -->
  <circle cx="88" cy="78" r="6" fill="#3d3d3d"/>
  <path d="M120 38 Q145 32 170 38" fill="none" stroke="#3d3d3d" stroke-width="7" stroke-linecap="round"/>
</svg>
